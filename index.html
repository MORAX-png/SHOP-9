<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP#9 Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero" id="home">
        <!-- High-quality professional fashion banner image -->
        <img src="https://unsplash.com" alt="SHOP#9 Clothing" class="hero-image">
        
        <div class="hero-content">
            <h1>SHOP#9</h1>
            <h2>NEW COLLECTION</h2>
            <p>Discover your style.</p>
            <a href="#products" class="shop-button">Shop Now</a>
        </div>
    </section>

    <!-- PRODUCTS SECTION -->
    <section class="products" id="products">
        <h2>Our Products</h2>
        <div class="product-grid">
            <!-- Product Item 1 -->
            <div class="product-card">
                <img src="https://unsplash.com" alt="Shirt Product">
                <h3>Classic Shirt</h3>
                <p class="price">$29.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
